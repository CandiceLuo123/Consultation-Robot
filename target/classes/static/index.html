<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI顾问</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31/dist/vue.global.min.js"></script>
    <style>
        /* ============================================
           CSS 自定义属性 —— 浅色主题（默认）
           ============================================ */
        :root {
            --color-bg: #f4f6f9;
            --color-surface: #ffffff;
            --color-surface-hover: #f8f9fc;
            --color-text-primary: #2d3a4a;
            --color-text-secondary: #8593a8;
            --color-text-tertiary: #b0bccb;
            --color-accent: #5c7c99;
            --color-accent-hover: #4e6d8a;
            --color-accent-light: #ecf0f5;
            --color-user-bubble-bg: #5c7c99;
            --color-user-bubble-text: #ffffff;
            --color-assistant-bubble-bg: #ffffff;
            --color-assistant-bubble-border: #e8ecf2;
            --color-border: #e8ecf2;
            --color-border-light: #f0f2f6;
            --color-input-bg: #f4f6f9;
            --color-input-focus-ring: rgba(92, 124, 153, 0.15);
            --color-header-bg: rgba(255, 255, 255, 0.72);
            --color-footer-bg: rgba(255, 255, 255, 0.85);
            --color-danger: #d9807e;
            --color-danger-hover: #c76b69;
            --shadow-bubble: 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-header: 0 1px 0 rgba(0, 0, 0, 0.04);
            --shadow-footer: 0 -1px 0 rgba(0, 0, 0, 0.04);
            --radius-bubble: 18px;
            --radius-input: 16px;
            --radius-btn: 12px;
            --radius-icon-btn: 10px;
            --transition-theme: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* ============================================
           CSS 自定义属性 —— 深色主题
           ============================================ */
        .dark {
            --color-bg: #171923;
            --color-surface: #1e2130;
            --color-surface-hover: #252839;
            --color-text-primary: #dce2ea;
            --color-text-secondary: #7b86a0;
            --color-text-tertiary: #5a6580;
            --color-accent: #6b8ab5;
            --color-accent-hover: #7d9cc7;
            --color-accent-light: #252d3d;
            --color-user-bubble-bg: #4a6080;
            --color-user-bubble-text: #ffffff;
            --color-assistant-bubble-bg: #1e2130;
            --color-assistant-bubble-border: #2a2d3d;
            --color-border: #2a2d3d;
            --color-border-light: #222536;
            --color-input-bg: #1e2130;
            --color-input-focus-ring: rgba(107, 138, 181, 0.2);
            --color-header-bg: rgba(23, 25, 35, 0.78);
            --color-footer-bg: rgba(23, 25, 35, 0.9);
            --color-danger: #c76b69;
            --color-danger-hover: #d9807e;
            --shadow-bubble: 0 1px 2px rgba(0, 0, 0, 0.12);
            --shadow-header: 0 1px 0 rgba(255, 255, 255, 0.03);
            --shadow-footer: 0 -1px 0 rgba(255, 255, 255, 0.03);
        }

        /* ============================================
           基础重置
           ============================================ */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            transition: var(--transition-theme);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================
           滚动条
           ============================================ */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-text-tertiary);
            border-radius: 20px;
            opacity: 0.5;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-text-secondary);
        }

        /* ============================================
           应用容器
           ============================================ */
        #app {
            background-color: var(--color-bg);
            transition: var(--transition-theme);
        }

        /* ============================================
           顶部导航
           ============================================ */
        .app-header {
            background: var(--color-header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-header);
            transition: var(--transition-theme);
            z-index: 10;
        }

        .app-logo {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--color-accent);
            transition: var(--transition-theme);
            user-select: none;
        }

        /* ============================================
           图标按钮（新建会话、暗黑模式）
           ============================================ */
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: var(--radius-icon-btn);
            background: transparent;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .icon-btn:hover {
            background: var(--color-surface-hover);
            color: var(--color-accent);
        }

        .icon-btn:active {
            transform: scale(0.94);
        }

        /* ============================================
           聊天区域
           ============================================ */
        .chat-area {
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 4px;
        }

        /* ============================================
           消息容器
           ============================================ */
        .message-wrapper {
            max-width: 720px;
            margin: 0 auto;
        }

        /* ============================================
           头像
           ============================================ */
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            transition: var(--transition-theme);
        }

        .avatar-user {
            background: var(--color-accent-light);
            color: var(--color-accent);
        }

        .avatar-assistant {
            background: var(--color-accent-light);
            color: var(--color-accent);
        }

        /* ============================================
           聊天气泡
           ============================================ */
        .bubble {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: var(--radius-bubble);
            line-height: 1.65;
            font-size: 0.95rem;
            word-break: break-word;
            transition: var(--transition-theme);
        }

        .bubble-user {
            background: var(--color-user-bubble-bg);
            color: var(--color-user-bubble-text);
            border-bottom-right-radius: 6px;
        }

        .bubble-assistant {
            background: var(--color-assistant-bubble-bg);
            color: var(--color-text-primary);
            border: 1px solid var(--color-assistant-bubble-border);
            box-shadow: var(--shadow-bubble);
            border-bottom-left-radius: 6px;
        }

        /* ============================================
           打字加载动画（三个点）
           ============================================ */
        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 2px 0;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--color-text-tertiary);
            animation: dotPulse 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.16s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.32s;
        }

        @keyframes dotPulse {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ============================================
           打字机光标
           ============================================ */
        .typing-cursor::after {
            content: "|";
            animation: cursorBlink 1s step-end infinite;
            color: var(--color-accent);
            font-weight: 300;
        }

        @keyframes cursorBlink {
            from, to {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ============================================
           字符渐入动画
           ============================================ */
        .fade-in {
            animation: charFadeIn 0.15s ease-out both;
        }

        @keyframes charFadeIn {
            from {
                opacity: 0;
                transform: translateY(2px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           底部输入区域
           ============================================ */
        .app-footer {
            background: var(--color-footer-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-footer);
            transition: var(--transition-theme);
            z-index: 10;
        }

        .input-inner {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .input-textarea {
            flex: 1;
            min-height: 46px;
            max-height: 180px;
            padding: 12px 18px;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-input);
            background: var(--color-input-bg);
            color: var(--color-text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: var(--transition-theme);
        }

        .input-textarea::placeholder {
            color: var(--color-text-tertiary);
        }

        .input-textarea:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px var(--color-input-focus-ring);
        }

        /* ============================================
           发送 / 停止 按钮
           ============================================ */
        .send-btn {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn-send {
            background: var(--color-accent);
            color: #ffffff;
        }

        .send-btn-send:hover:not(:disabled) {
            background: var(--color-accent-hover);
            transform: translateY(-1px);
        }

        .send-btn-send:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn-stop {
            background: var(--color-danger);
            color: #ffffff;
        }

        .send-btn-stop:hover {
            background: var(--color-danger-hover);
        }
    </style>
</head>
<body>
<div id="app" class="flex flex-col h-screen">
    <!-- ========================================
         顶部导航
         ======================================== -->
    <header class="app-header flex items-center justify-between py-3 px-5">
        <span class="app-logo">AI 顾问</span>
        <div class="flex items-center gap-1">
            <button
                    @click="startNewConversation"
                    class="icon-btn"
                    title="新建会话">
                <i class="fas fa-plus"></i>
            </button>
            <button
                    @click="toggleDarkMode"
                    class="icon-btn"
                    title="切换主题">
                <i :class="darkMode ? 'fas fa-moon' : 'fas fa-sun'"></i>
            </button>
        </div>
    </header>

    <!-- ========================================
         聊天内容区域
         ======================================== -->
    <main class="chat-area flex-1 overflow-y-auto py-6 px-4" ref="chatContainer">
        <div class="space-y-6">
            <div v-for="(message, index) in messages" :key="index" class="message-wrapper">
                <div :class="['flex items-start gap-3', message.role === 'user' ? 'flex-row-reverse' : '']">
                    <!-- 头像 -->
                    <div :class="['avatar', message.role === 'user' ? 'avatar-user' : 'avatar-assistant']">
                        <i :class="message.role === 'user' ? 'fas fa-user' : 'fas fa-robot'"></i>
                    </div>

                    <!-- 气泡 -->
                    <div :class="['bubble', message.role === 'user' ? 'bubble-user' : 'bubble-assistant']">
                        <!-- 加载动画 -->
                        <div v-if="message.role === 'assistant' && message.isLoading" class="typing-dots">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>

                        <!-- 消息正文 -->
                        <div v-else class="whitespace-pre-wrap break-words">
                                <span v-for="(char, charIndex) in message.content" :key="charIndex"
                                      :class="{'opacity-0 select-none': charIndex >= message.visibleChars, 'fade-in': charIndex < message.visibleChars}">
                                    {{ char }}
                                </span>
                            <span v-if="message.isStreaming" class="typing-cursor"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ========================================
         底部输入区域
         ======================================== -->
    <footer class="app-footer py-4 px-4">
        <div class="input-inner">
                <textarea
                        v-model="userInput"
                        @keydown.enter.exact.prevent="sendMessage"
                        @keydown.ctrl.enter.exact.prevent="sendMessage"
                        @keydown.esc.exact="stopResponse"
                        placeholder="输入您的问题…"
                        class="input-textarea"
                        rows="1"
                        ref="textarea"
                        @input="adjustTextareaHeight"
                ></textarea>

            <button
                    @click="isLoading ? stopResponse() : sendMessage()"
                    :disabled="!userInput.trim() && !isLoading"
                    :class="['send-btn', isLoading ? 'send-btn-stop' : 'send-btn-send']"
                    :title="isLoading ? '停止生成' : '发送消息'">
                <i :class="isLoading ? 'fas fa-stop' : 'fas fa-paper-plane'"></i>
            </button>
        </div>
    </footer>
</div>

<script>
    const {createApp, ref, nextTick, onMounted, watch} = Vue;

    createApp({
        setup() {
            const messages = ref([]);
            const userInput = ref('');
            const isLoading = ref(false);
            const chatContainer = ref(null);
            const textarea = ref(null);
            const darkMode = ref(false);

            const memoeryId = ref(Date.now().toString());
            let controller = null;
            let typingInterval = null;

            // ========== 调整文本区域高度 ==========
            const adjustTextareaHeight = () => {
                const textareaEl = textarea.value;
                if (!textareaEl) return;
                textareaEl.style.height = 'auto';
                textareaEl.style.height = `${Math.min(textareaEl.scrollHeight, 180)}px`;
            };

            // ========== 滚动到底部 ==========
            const scrollToBottom = () => {
                nextTick(() => {
                    if (chatContainer.value) {
                        chatContainer.value.scrollTop = chatContainer.value.scrollHeight;
                    }
                });
            };

            // ========== 切换暗黑模式 ==========
            const toggleDarkMode = () => {
                darkMode.value = !darkMode.value;
                localStorage.setItem('darkMode', darkMode.value);
            };

            // ========== 新建会话 ==========
            const startNewConversation = () => {
                messages.value = [];
                memoeryId.value = Date.now().toString();
                messages.value.push({
                    role: 'assistant',
                    content: '你好！我是主人提供的小烙AI顾问，请问有什么能帮到您？',
                    isLoading: false,
                    visibleChars: 0,
                    isStreaming: false
                });
                messages.value[0].visibleChars = messages.value[0].content.length;
                scrollToBottom();
                nextTick(() => {
                    if (textarea.value) textarea.value.focus();
                });
            };

            // ========== 逐字打印效果 ==========
            const startTypingEffect = (messageIndex) => {
                const message = messages.value[messageIndex];
                if (!message || message.visibleChars >= message.content.length) {
                    clearInterval(typingInterval);
                    typingInterval = null;
                    messages.value[messageIndex].isStreaming = false;
                    return;
                }
                messages.value[messageIndex].visibleChars++;
                scrollToBottom();
            };

            // ========== 发送消息 ==========
            const sendMessage = async () => {
                if (!userInput.value.trim() || isLoading.value) return;

                if (controller) controller.abort();
                controller = new AbortController();

                const userMessage = {
                    role: 'user',
                    content: userInput.value.trim(),
                    isLoading: false,
                    visibleChars: userInput.value.trim().length,
                    isStreaming: false
                };
                messages.value.push(userMessage);

                const assistantMessage = {
                    role: 'assistant',
                    content: '',
                    isLoading: true,
                    visibleChars: 0,
                    isStreaming: true
                };
                messages.value.push(assistantMessage);
                const messageIndex = messages.value.length - 1;

                userInput.value = '';
                adjustTextareaHeight();
                scrollToBottom();
                isLoading.value = true;

                try {
                    const response = await fetch(
                        `/chat?message=${encodeURIComponent(userMessage.content)}&memoryId=${memoeryId.value}`,
                        {signal: controller.signal}
                    );

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    if (typingInterval) {
                        clearInterval(typingInterval);
                        typingInterval = null;
                    }

                    while (true) {
                        const {done, value} = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, {stream: true});
                        buffer += chunk;

                        messages.value[messageIndex].content = buffer;
                        messages.value[messageIndex].isLoading = false;

                        if (!typingInterval) {
                            typingInterval = setInterval(() => {
                                startTypingEffect(messageIndex);
                            }, 20);
                        }
                        scrollToBottom();
                    }
                } catch (error) {
                    if (error.name === 'AbortError') {
                        console.log('请求被用户中止');
                    } else {
                        console.error('请求出错:', error);
                        const lastMessage = messages.value[messages.value.length - 1];
                        lastMessage.content = '抱歉，请求过程中出现错误: ' + error.message;
                        lastMessage.visibleChars = lastMessage.content.length;
                    }
                } finally {
                    const lastMessage = messages.value[messages.value.length - 1];
                    lastMessage.isLoading = false;
                    lastMessage.isStreaming = false;
                    if (lastMessage.visibleChars < lastMessage.content.length) {
                        lastMessage.visibleChars = lastMessage.content.length;
                    }
                    isLoading.value = false;
                    controller = null;
                    if (typingInterval) {
                        clearInterval(typingInterval);
                        typingInterval = null;
                    }
                    scrollToBottom();
                }
            };

            // ========== 停止响应 ==========
            const stopResponse = () => {
                if (controller) {
                    controller.abort();
                    const lastMessage = messages.value[messages.value.length - 1];
                    lastMessage.isLoading = false;
                    lastMessage.isStreaming = false;
                    if (lastMessage.visibleChars < lastMessage.content.length) {
                        lastMessage.visibleChars = lastMessage.content.length;
                    }
                    isLoading.value = false;
                    controller = null;
                    if (typingInterval) {
                        clearInterval(typingInterval);
                        typingInterval = null;
                    }
                }
            };

            // ========== 初始化 ==========
            onMounted(() => {
                darkMode.value = localStorage.getItem('darkMode') === 'true' ||
                    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

                messages.value.push({
                    role: 'assistant',
                    content: '你好！我是主人提供的小烙AI顾问，请问有什么能帮到您？',
                    isLoading: false,
                    visibleChars: 0,
                    isStreaming: false
                });
                messages.value[0].visibleChars = messages.value[0].content.length;
                scrollToBottom();
                nextTick(() => {
                    if (textarea.value) textarea.value.focus();
                });
            });

            // ========== 监听暗黑模式切换 → 同步 HTML 类 ==========
            watch(darkMode, (val) => {
                document.documentElement.classList.toggle('dark', val);
            }, {immediate: true});

            // ========== 监听消息变化 → 自动滚动 ==========
            watch(messages, scrollToBottom, {deep: true});

            return {
                messages,
                userInput,
                isLoading,
                darkMode,
                chatContainer,
                textarea,
                sendMessage,
                stopResponse,
                toggleDarkMode,
                adjustTextareaHeight,
                startNewConversation
            };
        }
    }).mount('#app');
</script>
</body>
</html>
